        tap_action:
          action: none
        hold_action:
          action: none
        image: /hacsfiles/ha-floorplan-home/woonkamer/floorplan/1500/light.haard.png?version=93F0369D076887AFCBC12D3F617FC44F
        filter: none
        style:
          left: 50%
          top: 50%
          width: 100%
          mix-blend-mode: lighten
