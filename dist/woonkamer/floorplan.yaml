type: picture-elements
image: /hacsfiles/ha-floorplan-home/woonkamer/floorplan/transparent.png?version=1C1DF8629376E00593CE433608A69F6A
elements:
  - type: conditional
    title: Day-time, Base
    conditions:
      - condition: state
        entity: sun.sun
        state: above_horizon
    elements:
      - type: image
        tap_action:
          action: none
        hold_action:
          action: none
        image: /hacsfiles/ha-floorplan-home/woonkamer/floorplan/1500/base.png?version=CB2AE69C8ED4A2D04EAFA658D69312BE
        filter: none
        style:
          left: 50%
          top: 50%
          width: 100%
  - type: conditional
    title: Day-time, light.erker_spots
    conditions:
      - condition: state
        entity: light.erker_spots
        state: 'on'
      - condition: state
        entity: sun.sun
        state: above_horizon
    elements:
      - type: custom:config-template-card
        variables:
          LIGHT_STATE: states['light.erker_spots'].state
          COLOR_MODE: states['light.erker_spots'].attributes.color_mode
          LIGHT_COLOR: states['light.erker_spots'].attributes.hs_color
          BRIGHTNESS: states['light.erker_spots'].attributes.brightness
          isInColoredMode: colorMode => ['hs', 'rgb', 'rgbw', 'rgbww', 'white', 'xy'].includes(colorMode)
        entities:
          - light.erker_spots
        element:
          type: image
          image: >-
              ${!isInColoredMode(COLOR_MODE) || (isInColoredMode(COLOR_MODE) && LIGHT_COLOR && LIGHT_COLOR[0] == 0 && LIGHT_COLOR[1] == 0) ?
              '/hacsfiles/ha-floorplan-home/woonkamer/floorplan/1500/light.erker_spots.png?version=64CE156E48384487250B580A12B0E54C' :
              '/hacsfiles/ha-floorplan-home/woonkamer/floorplan/1500/light.erker_spots.red.png?version=A2CCEC3138F834609D86C5E9CC411776' }
        style:
          filter: '${ "hue-rotate(" + (isInColoredMode(COLOR_MODE) && LIGHT_COLOR ? LIGHT_COLOR[0] : 0) + "deg) saturate(" + (LIGHT_COLOR ? LIGHT_COLOR[1] / 100 : 1) + ")"}'
          opacity: '${LIGHT_STATE === ''on'' ? (BRIGHTNESS / 255) : ''100''}'
          mix-blend-mode: lighten
          pointer-events: none
          left: 50%
          top: 50%
          width: 100%
  - type: conditional
    title: Day-time, light.haard
    conditions:
      - condition: state
        entity: light.haard
        state: 'on'
